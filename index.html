<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>THE SYSTEM // Solo Leveling Habit, Workout &amp; Focus Gate</title>
  <meta name="description" content="Gamified self-improvement, workout tracker, and deep-focus application modeled after the System from Solo Leveling. Daily quests, 22 hunter tiers, Focus Gates, and the Penalty Zone.">
  <meta name="theme-color" content="#04060A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Solo Quest">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap">
  <link rel="stylesheet" href="css/style.css?v=3.21">
  <link rel="stylesheet" href="css/leaflet.css">
</head>
<body>
  <!-- Atmospheric Scanlines & Particle Canvas -->
  <div class="scanlines" aria-hidden="true"></div>
  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <!-- SVG Glow Filter Definition -->
  <svg width="0" height="0" style="position:absolute; pointer-events:none;" aria-hidden="true">
    <defs>
      <filter id="system-glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="3" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    </defs>
  </svg>

  <!-- Dark Lock Grace Warning Banner -->
  <div class="grace-warning-banner" id="grace-banner">
    [FOCUS TELEMETRY WARNING] WINDOW BLURRED // RETURN WITHIN 15 SECONDS OR SUFFER GATE BREACH
  </div>

  <!-- Cinematic ARISE Title Intro -->
  <div id="arise-intro" class="arise-intro" role="dialog" aria-label="System Awakening Intro">
    <div class="arise-canvas-wrap">
      <canvas id="arise-canvas"></canvas>
    </div>
    <div class="arise-ambient-glow"></div>
    <div class="arise-flare-line"></div>
    <div class="arise-center-stage">
      <div class="arise-hangul">일어나라</div>
      <h1 class="arise-title" id="arise-title"><span class="arise-char" style="--i:0">A</span><span class="arise-char" style="--i:1">R</span><span class="arise-char" style="--i:2">I</span><span class="arise-char" style="--i:3">S</span><span class="arise-char" style="--i:4">E</span></h1>
      <div class="arise-subline font-mono">[THE SHADOW MONARCH AWAKENS]</div>
    </div>
    <div class="arise-vignette"></div>
    <div class="arise-bar arise-bar-top"></div>
    <div class="arise-bar arise-bar-bottom"></div>
    <button type="button" class="arise-skip-btn" id="btn-intro-skip" title="Skip Intro">
      SKIP &rarr;
    </button>
  </div>

  <!-- App Root Shell -->
  <div id="app-root">
    <!-- Tactical Topbar -->
    <header class="system-topbar" id="system-topbar">
      <div class="topbar-left">
        <h1 class="system-badge" id="system-brand">
          <svg class="ico ico-glow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M12 2l2 6.5-1 4.5 3.5 1-1 2.5-3.5-1.5L12 19l-1-4-3.5 1.5-1-2.5 3.5-1-1-4.5z" fill="currentColor" fill-opacity="0.15"/>
            <path d="M12 2l2 6.5-1 4.5 3.5 1-1 2.5-3.5-1.5L12 19l-1-4-3.5 1.5-1-2.5 3.5-1-1-4.5z"/>
            <path d="M12 2v17M12 19v3.5M10.5 22.5h3"/>
          </svg>
          [SYSTEM HUD]
        </h1>
        <div class="stat-pill rank-badge" id="top-rank-badge" style="font-weight:700; white-space:nowrap; flex-shrink:0;">E-IV</div>
      </div>

      <!-- Desktop Navigation -->
      <nav class="desktop-nav" id="desktop-nav" aria-label="Main Navigation">
        <button class="nav-btn active" data-view="quests" id="nav-btn-quests">
          <svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 2.5h14v19H5z"/><path d="M8 7.5h1.2M11 7.5h5M8 12h1.2M11 12h5M8 16.5h1.2M11 16.5h5"/><path d="M9 2.5v-1h6v1"/></svg>
          QUESTS
        </button>
        <button class="nav-btn" data-view="status" id="nav-btn-status">
          <svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2l8.5 5v10L12 22l-8.5-5V7z"/><circle cx="12" cy="10" r="3"/><path d="M7 17.3c1-2.4 3-3.5 5-3.5s4 1.1 5 3.5"/></svg>
          STATUS
        </button>
        <button class="nav-btn" data-view="gate" id="nav-btn-gate">
          <svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9.2"/><circle cx="12" cy="12" r="5.6" stroke-dasharray="2 1.6"/><circle cx="12" cy="12" r="2" fill="currentColor" stroke="none"/><path d="M12 1v3.2M12 19.8V23M1 12h3.2M19.8 12H23"/></svg>
          DUNGEON GATE
        </button>
        <button class="nav-btn" data-view="run" id="nav-btn-run">
          <svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
          GPS RUN
        </button>
        <button class="nav-btn" data-view="vault" id="nav-btn-vault">
          <svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9h18v11.5H3z"/><path d="M3 9l2-5h14l2 5"/><path d="M10 12h4v3.5h-4z"/></svg>
          VAULT
        </button>
        <button class="nav-btn" data-view="rank" id="nav-btn-rank">
          <svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3.5 18 2 7l5.5 4L12 4l4.5 7L22 7l-1.5 11z"/><path d="M3.5 21h17"/></svg>
          RANKINGS
        </button>
        <button class="nav-btn" data-view="settings" id="nav-btn-settings">
          <svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="6.6"/><path d="M12 2v3.4M12 18.6V22M2 12h3.4M18.6 12H22"/></svg>
          SETTINGS
        </button>
      </nav>

      <!-- Player Currencies & Streak -->
      <div class="topbar-right">
        <div class="topbar-stats">
          <div class="stat-pill streak" id="pill-streak" title="Daily Streak">
            <svg class="ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2l3 6 3-2v7.5a6 6 0 0 1-12 0V9l3 2z"/><path d="M12 13l2 3a2 2 0 0 1-4 0z" fill="currentColor" stroke="none"/></svg>
            <span id="top-streak">0D</span>
          </div>
          <div class="stat-pill gold" id="pill-gold" title="Hunter Gold">
            <svg class="ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2.8l7.8 4.5v9.4L12 21.2l-7.8-4.5V7.3z"/><path d="M12 7l4.3 2.5v5L12 17l-4.3-2.5v-5z"/></svg>
            <span id="top-gold">100</span>
          </div>
          <div class="stat-pill essence" id="pill-essence" title="Essence Stones">
            <svg class="ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2l5.2 6.2L12 22 6.8 8.2z"/><path d="M6.8 8.2h10.4M12 2v20" opacity=".55"/></svg>
            <span id="top-essence">0</span>
          </div>
          <button class="sys-btn sm auth-status-btn unauthenticated" id="btn-topbar-auth" title="Hunter Network & Cloud Database Terminal">
            <svg class="ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2l8.5 5v10L12 22l-8.5-5V7z"/><circle cx="12" cy="10" r="3"/><path d="M7 17.3c1-2.4 3-3.5 5-3.5s4 1.1 5 3.5"/></svg>
            <span id="top-auth-label">SYSTEM LINK</span>
          </button>
          <button class="sys-btn sm primary pwa-install-btn hidden" id="btn-pwa-install" title="Install Solo Quest System App">
            <svg class="ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg>
            INSTALL APP
          </button>
        </div>
      </div>
    </header>

    <!-- Main Viewport -->
    <main class="main-viewport" id="view-container">
      <!-- Dynamic view content injected here by js/ui.js -->
    </main>

    <!-- Mobile Bottom Navigation Dock -->
    <nav class="mobile-dock" id="mobile-dock" aria-label="Mobile Navigation">
      <button class="dock-btn active" data-view="quests" id="dock-btn-quests">
        <svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 2.5h14v19H5z"/><path d="M8 7.5h1.2M11 7.5h5M8 12h1.2M11 12h5M8 16.5h1.2M11 16.5h5"/><path d="M9 2.5v-1h6v1"/></svg>
        <span>Quests</span>
      </button>
      <button class="dock-btn" data-view="status" id="dock-btn-status">
        <svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2l8.5 5v10L12 22l-8.5-5V7z"/><circle cx="12" cy="10" r="3"/><path d="M7 17.3c1-2.4 3-3.5 5-3.5s4 1.1 5 3.5"/></svg>
        <span>Status</span>
      </button>
      <button class="dock-btn" data-view="gate" id="dock-btn-gate">
        <svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9.2"/><circle cx="12" cy="12" r="5.6" stroke-dasharray="2 1.6"/><circle cx="12" cy="12" r="2" fill="currentColor" stroke="none"/><path d="M12 1v3.2M12 19.8V23M1 12h3.2M19.8 12H23"/></svg>
        <span>Gate</span>
      </button>
      <button class="dock-btn" data-view="run" id="dock-btn-run">
        <svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
        <span>Run</span>
      </button>
      <button class="dock-btn" data-view="vault" id="dock-btn-vault">
        <svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9h18v11.5H3z"/><path d="M3 9l2-5h14l2 5"/><path d="M10 12h4v3.5h-4z"/></svg>
        <span>Vault</span>
      </button>
      <button class="dock-btn" data-view="rank" id="dock-btn-rank">
        <svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3.5 18 2 7l5.5 4L12 4l4.5 7L22 7l-1.5 11z"/><path d="M3.5 21h17"/></svg>
        <span>Rank</span>
      </button>
      <button class="dock-btn" data-view="settings" id="dock-btn-settings">
        <svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="6.6"/><path d="M12 2v3.4M12 18.6V22M2 12h3.4M18.6 12H22"/></svg>
        <span>Config</span>
      </button>
    </nav>
  </div>

  <!-- System Modal Container -->
  <div class="modal-overlay" id="system-modal" role="dialog" aria-modal="true">
    <div class="modal-panel" id="modal-content">
      <!-- Modal contents injected here dynamically -->
    </div>
  </div>

  <!-- Toast Notices Container -->
  <aside id="toast-container" aria-live="polite" aria-atomic="true"></aside>

  <!-- Application Logic Scripts -->
  <script src="js/icons.js?v=3.21"></script>
  <script src="js/data.js?v=3.21"></script>
  <script src="js/engine.js?v=3.21"></script>
  <script src="js/api.js?v=3.21"></script>
  <script src="js/auth.js?v=3.21"></script>
  <script src="js/audio.js?v=3.21"></script>
  <script src="js/leaflet.js"></script>
  <script src="js/tracker.js?v=3.21"></script>
  <script src="js/gate.js?v=3.21"></script>
  <script src="js/ui.js?v=3.21"></script>
  <script src="js/intro.js?v=3.21"></script>
  <script src="js/app.js?v=3.21"></script>
</body>
</html>
